services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: anime_black
      POSTGRES_USER: anime
      POSTGRES_PASSWORD: anime123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
